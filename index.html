<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radhakrishna Communication & Electronics</title>
    <!-- আধুনিক ও প্রিমিয়াম বোল্ড ফন্ট -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e4eaf2 0%, #cbd6e2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* ===================================================
           ১. টাইটেল বক্স (সফট প্যাস্টেল ল্যাভেন্ডার কালার)
        =================================================== */
        .title-box {
            background: linear-gradient(145deg, #fbf7ff 0%, #f3e8ff 100%);
            border-radius: 22px;
            padding: 24px 18px;
            text-align: center;
            border: 2px solid #e9d5ff;
            box-shadow: 0 12px 28px rgba(147, 51, 234, 0.10);
            position: relative;
            opacity: 0;
            animation: boxSlideFastLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        /* লোগো ফ্রেম */
        .logo-wrapper {
            width: 88px;
            height: 88px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 4px;
            background: #ffffff;
            border: 3px solid #0f172a;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.16), 0 2px 6px rgba(15, 23, 42, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 0;
            animation: wordBounceDrop 0.65s cubic-bezier(0.25, 1.25, 0.5, 1) 0.65s forwards;
        }

        .logo-wrapper img, 
        .logo-wrapper svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        /* টাইটেল টেক্সট */
        .shop-title {
            font-size: 21px;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .shop-title .animated-word {
            display: inline-block;
            color: #0f172a;
            opacity: 0;
            text-shadow: 0 2px 4px rgba(15, 23, 42, 0.15);
            animation: wordBounceDrop 0.7s cubic-bezier(0.25, 1.3, 0.4, 1) forwards;
        }

        .word-radhakrishna {
            animation-delay: 0.85s;
        }
        .word-communication {
            animation-delay: 1.05s;
        }
        .word-electronics {
            animation-delay: 1.25s;
        }

        .tagline {
            font-size: 13px;
            font-weight: 600;
            color: #6b21a8;
            margin-top: 9px;
            letter-spacing: 0.3px;
            opacity: 0;
            animation: fadeInSettle 0.5s ease 1.45s forwards;
        }

        /* ===================================================
           ২. নিচের মূল বড় বক্স
        =================================================== */
        .main-box {
            background: linear-gradient(150deg, #f0f7ff 0%, #e2ecf8 100%);
            border-radius: 24px;
            padding: 25px 20px;
            border: 2px solid #cbdcf2;
            box-shadow: 0 16px 36px rgba(37, 99, 235, 0.1);
            opacity: 0;
            animation: boxSlideFastRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        .section-block {
            margin-bottom: 20px;
        }
        .section-block:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #475569;
            margin-bottom: 9px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1.5px;
            background: #cbd5e1;
        }

        /* বাটন ডিজাইন */
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 14px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
        }

        .button:last-child {
            margin-bottom: 0;
        }

        .button:hover,
        .button:focus {
            transform: translateY(-2px);
            filter: brightness(1.05);
            z-index: 5;
        }

        .button:active {
            transform: translateY(3px) !important;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 60%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-25deg);
            transition: 0.75s ease;
        }
        .button:hover::before {
            left: 140%;
        }

        /* বাটন কালার ও শ্যাডো */
        .call {
            background: linear-gradient(135deg, #ff9100 0%, #e65100 100%);
            box-shadow: 0 4px 0 #b33900, 0 8px 18px rgba(230, 81, 0, 0.3);
        }
        .call:hover { box-shadow: 0 6px 0 #b33900, 0 12px 22px rgba(230, 81, 0, 0.4); }
        .call:active { box-shadow: 0 1px 0 #b33900, 0 3px 6px rgba(230, 81, 0, 0.3); }

        .whatsapp {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 0 #047857, 0 8px 18px rgba(16, 185, 129, 0.3);
        }
        .whatsapp:hover { box-shadow: 0 6px 0 #047857, 0 12px 22px rgba(16, 185, 129, 0.4); }
        .whatsapp:active { box-shadow: 0 1px 0 #047857, 0 3px 6px rgba(16, 185, 129, 0.3); }

        .products-btn {
            background: linear-gradient(135deg, #9333ea 0%, #6b21a8 100%);
            font-size: 16px;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 0 #4c1d95, 0 8px 18px rgba(147, 51, 234, 0.35);
            animation: pulseCta 2s infinite ease-in-out;
        }
        .products-btn:hover {
            box-shadow: 0 6px 0 #4c1d95, 0 12px 24px rgba(147, 51, 234, 0.5) !important;
        }
        .products-btn:active {
            box-shadow: 0 1px 0 #4c1d95, 0 3px 6px rgba(147, 51, 234, 0.3) !important;
        }

        .blinking-arrow {
            display: inline-block;
            font-size: 19px;
            font-weight: 900;
            color: #ffe066;
            animation: arrowBlinkSlide 0.75s infinite alternate ease-in-out;
            transform-origin: center;
        }

        @keyframes arrowBlinkSlide {
            0% {
                transform: translateX(0) scale(1);
                opacity: 1;
                filter: drop-shadow(0 0 4px #fff);
            }
            100% {
                transform: translateX(8px) scale(1.2);
                opacity: 0.25;
                filter: drop-shadow(0 0 10px #ffe066);
            }
        }

        @keyframes pulseCta {
            0% { box-shadow: 0 4px 0 #4c1d95, 0 6px 16px rgba(147, 51, 234, 0.4); }
            50% { box-shadow: 0 4px 0 #4c1d95, 0 10px 24px rgba(147, 51, 234, 0.65), 0 0 12px rgba(168, 85, 247, 0.4); }
            100% { box-shadow: 0 4px 0 #4c1d95, 0 6px 16px rgba(147, 51, 234, 0.4); }
        }

        /* প্রিন্ট বাটন স্টাইল */
        .print-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            box-shadow: 0 4px 0 #282375, 0 8px 18px rgba(79, 70, 229, 0.35);
        }
        .print-btn:hover { box-shadow: 0 6px 0 #282375, 0 12px 22px rgba(79, 70, 229, 0.45); }
        .print-btn:active { box-shadow: 0 1px 0 #282375, 0 3px 6px rgba(79, 70, 229, 0.3); }

        .pay {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 4px 0 #0369a1, 0 8px 18px rgba(14, 165, 233, 0.3);
        }
        .pay:hover { box-shadow: 0 6px 0 #0369a1, 0 12px 22px rgba(14, 165, 233, 0.4); }
        .pay:active { box-shadow: 0 1px 0 #0369a1, 0 3px 6px rgba(14, 165, 233, 0.3); }

        .location {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            box-shadow: 0 4px 0 #9f1239, 0 8px 18px rgba(244, 63, 94, 0.3);
        }
        .location:hover { box-shadow: 0 6px 0 #9f1239, 0 12px 22px rgba(244, 63, 94, 0.4); }
        .location:active { box-shadow: 0 1px 0 #9f1239, 0 3px 6px rgba(244, 63, 94, 0.3); }

        /* ===================================================
           ৩. অ্যানিমেশনস
        =================================================== */
        @keyframes boxSlideFastLeft {
            0% { opacity: 0; transform: translateX(-120%); }
            80% { opacity: 1; transform: translateX(8px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes boxSlideFastRight {
            0% { opacity: 0; transform: translateX(120%); }
            80% { opacity: 1; transform: translateX(-8px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes wordBounceDrop {
            0% { opacity: 0; transform: translateY(-60px); }
            50% { opacity: 1; transform: translateY(12px); }
            75% { transform: translateY(-8px); }
            90% { transform: translateY(2px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInSettle {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            0% { opacity: 0; transform: translateX(-35px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(35px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .anim-call-1  { animation: slideInLeft 0.4s ease 1.50s backwards; }
        .anim-call-2  { animation: slideInRight 0.4s ease 1.60s backwards; }
        .anim-wa      { animation: zoomIn 0.4s ease 1.70s backwards; }
        .anim-prod    { animation: slideInLeft 0.45s ease 1.80s backwards; }
        .anim-print   { animation: slideInRight 0.4s ease 1.90s backwards; }
        .anim-pay     { animation: slideInLeft 0.4s ease 2.00s backwards; }
        .anim-loc     { animation: zoomIn 0.4s ease 2.10s backwards; }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- ১. ওপরের টাইটেল বক্স -->
        <div class="title-box">
            
            <div class="logo-wrapper">
                <img src="https://i.ibb.co/LDMBNB6B/IMG-20261001-103721-jpg.jpg" alt="Shop Logo">
            </div>

            <h1 class="shop-title">
                <span class="animated-word word-radhakrishna">Radhakrishna</span>
                <span class="animated-word word-communication">Communication</span>
                <span class="animated-word word-electronics">&amp; Electronics</span>
            </h1>

            <div class="tagline">Mobile Accessories • Digital Services • Printing</div>
        </div>

        <!-- ২. নিচের মূল বড় বক্স -->
        <div class="main-box">
            
            <div class="section-block">
                <div class="section-title">Contact Us</div>
                <a href="tel:+918972727849" class="button call anim-call-1">📞 Call Now: 8972727849</a>
                <a href="tel:+917602687113" class="button call anim-call-2">📞 Call Now: 7602687113</a>
            </div>

            <div class="section-block">
                <div class="section-title">Chat with us</div>
                <a href="https://wa.me/917602687113" target="_blank" rel="noopener noreferrer" class="button whatsapp anim-wa">💬 WhatsApp Chat</a>
            </div>

            <div class="section-block">
                <div class="section-title">Our Products</div>
                <a href="https://radhakrishna-communication.onrender.com/" target="_blank" rel="noopener noreferrer" class="button products-btn anim-prod">
                    <span>🛍 View Products</span>
                    <span class="blinking-arrow">➔</span>
                </a>
            </div>

            <!-- ⭐ পরিবর্তন ১ ও ২: View Products এর নিচে এবং Pay Now এর ওপরে রিডাইরেক্ট লিঙ্কযুক্ত Print Now বাটন -->
            <div class="section-block">
                <div class="section-title">Print Service</div>
                <!-- নিচে href="#" এর জায়গায় আপনার কাঙ্ক্ষিত পেজের লিংকটি বসিয়ে দিন -->
                <a href="https://print-uqxe.onrender.com" target="_blank" rel="noopener noreferrer" class="button print-btn anim-print">🖨️️ Print Now (প্রিন্ট করুন)</a>
            </div>

            <div class="section-block">
                <div class="section-title">Pay Now</div>
                <a href="upi://pay?pa=Q686589374@ybl&pn=RadhakrishnaCommunication&cu=INR" class="button pay anim-pay">💳 Pay Now (UPI)</a>
            </div>

            <div class="section-block">
                <div class="section-title">Visit Us</div>
                <a href="https://maps.app.goo.gl/q5mJJk5C9BadWiiX9" target="_blank" rel="noopener noreferrer" class="button location anim-loc">📍 Shop Location</a>
            </div>

        </div>
    </div>

</body>
</html>
